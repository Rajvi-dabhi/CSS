<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Types Of CSS</title>
        <link rel="stylesheet" href="./01_intro_and_types.css" />

        <style>
            .internal{
                color: indigo;
                font-size: 40px;
            }
        </style>
    </head>
    <body>
        <!-- Inline CSS -->

        <p style="color: skyblue; font-size: 40px;">inline CSS</p>

        <!-- Internal CSS -->

        <p class="internal">internal CSS</p>

        <!-- External CSS -->

        <p id="external">external CSS</p>
    </body>
</html>
