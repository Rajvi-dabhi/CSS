<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Position</title>
        <link rel="stylesheet" href="./12_Position.css" />
    </head>
    <body>

        <div class="container">
            <div class="box">
            <p class="static">static</p>
            </div>

            <div class="box">
                <p class="relative">relative</p>
            </div>


            <div class="box">
                <p class="absolute">absolute</p>
            </div>
    

            <div class="box">
                <p class="fixed">fixed</p>
            </div>
    

            <div class="box">
                <p class="sticky">sticky</p>
            </div>

        </div>
    


        
    </body>
</html>
